name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Clean App
        run: |
          rm -rf clean_app
          flutter create clean_app --project-name prakash_cash_management --org com.prakash.cashmanagement
          cp lib/main.dart clean_app/lib/main.dart
          cd clean_app
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashManagement-APK
          path: clean_app/build/app/outputs/flutter-apk/app-debug.apk
