name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android SDK Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Build Clean Application
        run: |
          # पुरानी डायरेक्टरी हटाएं यदि मौजूद हो
          rm -rf clean_app
          
          # नया प्रोजेक्ट बनाएं
          flutter create clean_app --project-name prakash_cash_management --org com.prakash.cashmanagement
          
          # आपकी main.dart को कॉपी करें
          cp lib/main.dart clean_app/lib/main.dart
          
          # पैकेज जोड़ें और बिल्ड करें
          cd clean_app
          flutter pub add intl
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashManagement-APK
          path: clean_app/build/app/outputs/flutter-apk/app-release.apk
