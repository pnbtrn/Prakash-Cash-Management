name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Flutter App
        run: |
          # नया साफ प्रोजेक्ट बनाएँ
          flutter create app --project-name prakash_cash_management --org com.prakash.cashmanagement
          
          # हमारी बनाई main.dart को नए प्रोजेक्ट में कॉपी करें
          cp lib/main.dart app/lib/main.dart
          
          # intl पैकेज जोड़ें
          cd app
          flutter pub add intl
          flutter pub get

      - name: Build Debug APK
        run: |
          cd app
          flutter build apk --debug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: CashManagement-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
